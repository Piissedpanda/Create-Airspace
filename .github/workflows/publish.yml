name: Publish

# Push a tag like v1.0.0 to upload that version to Modrinth and CurseForge.
# Needs the repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN and the
# project ids in gradle.properties; without them it only does a dry run.
# "Run workflow" uploads by hand, e.g. only to one platform after a failed upload.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle task'
        type: choice
        default: publishMods
        options:
          - publishMods
          - publishModrinth
          - publishCurseforge

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag against mod_version
        if: github.event_name == 'push'
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and publish
        run: ./gradlew build ${{ inputs.task || 'publishMods' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
